name: CI

on:
  push:
    branches: [main, production/**]
  pull_request:
    branches: [main, production/**]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rewards-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rewards-agent/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build
